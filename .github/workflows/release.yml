name: Release

# Publishes to npm when a version tag is pushed (v1.2.3), using npm trusted
# publishing (OIDC): no npm token is stored in the repository.
# The tag must match the version in package.json.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Check npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " is too old for trusted publishing"); process.exit(1); }
          ' "$(npm --version)"
      - run: npm ci
      - run: npm test
      - name: Publish with provenance
        run: npm publish --provenance --access public
